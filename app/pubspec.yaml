name: bragi
description: "Bragi: chat with your own cloud over Weirdnet."
publish_to: "none"
version: 0.1.0+2
homepage: https://github.com/WeirdBrains/bragi
repository: https://github.com/WeirdBrains/bragi

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_rust_bridge_hooks: 2.13.0
  path_provider: ^2.1.5
  # 2.3.x pulls package:jni into desktop FFI plugin lists.
  path_provider_android: '>=2.2.5 <2.3.0'
  qr: ^4.0.1
  file_picker: ^10.3.10
  material_ui: ^1.11.0
  # Links in replies open in the system browser.
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
