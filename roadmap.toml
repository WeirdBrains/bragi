# The roadmap, one source of truth. `site/tool/gen_roadmap.py` renders it to ROADMAP.md and to
# the site's Roadmap page (site/lib/content/roadmap.dart). Keep it consistent with Ymir's
# docs/DESIGN.md ("Bragi milestones" and "B1 status"); update both in the same change.
#
# status: "done" | "in-progress" | "planned"

[project]
name = "Bragi"
updated = "2026-11-19"
intro = "Bragi is the chat client for a Ymir cloud. Every milestone ships its features in the shared Rust core for both the desktop and phone shells, so neither falls behind. The plan lives in Ymir's design doc."
design = "https://github.com/WeirdBrains/ymir/blob/main/docs/DESIGN.md#bragi-milestones"
unpublished = ["weirdnet-push"]   # planned crates with no crates.io page yet

[[milestone]]
id = "B1"
title = "Core and both shells"
status = "done"
summary = "Pair with your own devices, list the models your cloud offers, stream a chat, stop it and continue it, and keep local history. Works in the Linux desktop app (GPUI) and the Android app (Flutter), both on one shared Rust core."
crates = ["weirdnet-agent", "weirdnet-device-link", "weirdnet-sync", "weirdnet-net", "weirdnet-relay"]
gaps = [
  "Tested against a simulated inference node, not yet a real Ymir node or across real machines.",
  "Link codes are pasted, with no QR scanner yet. Nothing is released or on a store.",
]

[[milestone]]
id = "B2"
title = "Pool client"
status = "done"
summary = "Use several inference nodes at once: one combined model list, retries, and automatic mid-answer failover, with the stand-in and cache flags shown in both shells."
crates = ["weirdnet-agent"]
gaps = [
  "Run against two simulated inference nodes only, not yet against real Ymir nodes or across machines.",
  "Ymir M5 nodes now resume from text already shown, but that has only been tried against a mock engine on one computer.",
  "Nodes are tried warm first. Speed and distance are not weighed, and you can't pick a node yourself.",
]

[[milestone]]
id = "B3"
title = "Platforms"
status = "in-progress"
summary = "iOS (TestFlight), macOS and Windows, and Android packaging for the apk, aab and F-Droid. Android release builds, F-Droid metadata and a Linux tarball are built; macOS, Windows and iOS need machines this box doesn't have."
crates = []
gaps = [
  "macOS, Windows and iOS are not built or tested yet. The desktop shell compiles for Windows (cargo check), and a CI workflow and iOS project exist but have not run.",
  "Nothing is signed with a real key or uploaded. Play, F-Droid and TestFlight need a keystore, a tagged release and Apple developer access from m3talsmith.",
  "The F-Droid recipe is a draft that was never run through fdroid build.",
]

[[milestone]]
id = "B4"
title = "Sync and optional extras"
status = "planned"
summary = "Chat history on the shared context store, so a conversation follows you between devices. Optional: an on-device model and push wake-ups."
crates = ["weirdnet-sync", "weirdnet-push"]
gaps = ["Waits on Ymir's context sync (M5). `weirdnet-push` is planned and does not exist yet."]

[[milestone]]
id = "B5"
title = "Breadth"
status = "planned"
summary = "BSDs where the desktop toolkit builds, agent mode and attachments, on both shells."
crates = ["weirdnet-agent"]
gaps = []
