# The roadmap, one source of truth. `site/tool/gen_roadmap.py` renders it to ROADMAP.md and to
# the site's Roadmap page (site/lib/content/roadmap.dart). Keep it consistent with Ymir's
# docs/DESIGN.md ("Bragi milestones" and "B1 status"); update both in the same change.
#
# status: "done" | "in-progress" | "planned"

[project]
name = "Bragi"
updated = "2026-11-20"
intro = "Bragi is the chat client for a Ymir cloud. Every milestone ships its features in the shared Rust core for both the desktop and phone shells, so neither falls behind. The plan lives in Ymir's design doc."
design = "https://github.com/WeirdBrains/ymir/blob/main/docs/DESIGN.md#bragi-milestones"
unpublished = ["weirdnet-push"]   # planned crates with no crates.io page yet

[[milestone]]
id = "B1"
title = "Core and both shells"
status = "done"
summary = "Pair with your own devices, list the models your cloud offers, stream a chat, stop it and continue it, and keep local history. Works in the Linux desktop app (GPUI) and the Android app (Flutter), both on one shared Rust core."
crates = ["weirdnet-agent", "weirdnet-device-link", "weirdnet-sync", "weirdnet-net", "weirdnet-relay"]

[[milestone]]
id = "B2"
title = "Pool client"
status = "done"
summary = "Use several inference nodes at once: one combined model list, retries, and automatic mid-answer failover, with the stand-in and cache flags shown in both shells."
crates = ["weirdnet-agent"]

[[milestone]]
id = "B3"
title = "Platforms"
status = "in-progress"
summary = "iOS, macOS and Windows, and Android packaging for the apk, aab and F-Droid. Released in v0.1.0: Linux packages and tarballs, macOS dmg, Windows installers, Android apks and an unsigned iOS ipa. Next: store listings (Play, F-Droid, TestFlight) and signing with a release key."
crates = []

[[milestone]]
id = "B4"
title = "Sync and optional extras"
status = "in-progress"
summary = "Chat history on the shared context store, so a conversation follows you between devices: built and shown on both shells. Next: push wake-ups and an optional on-device model."
crates = ["weirdnet-sync", "weirdnet-push"]

[[milestone]]
id = "B5"
title = "Breadth"
status = "in-progress"
summary = "Text, image and audio attachments and agent mode (tool calls with approval cards) are built on both shells. Next: BSD support, once the desktop toolkit builds there."
crates = ["weirdnet-agent"]
