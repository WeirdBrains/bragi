[package]
name = "bragi-desktop"
description = "Bragi's desktop shell on GPUI: draws bragi-core's state and dispatches its actions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "bragi"
path = "src/main.rs"

[dependencies]
bragi-core = { workspace = true, features = ["decode"] }
cpal.workspace = true
bragi-mcp.workspace = true
bragi-serve.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
qrcode = { version = "0.14", default-features = false }
tempfile.workspace = true
tokio.workspace = true
weirdnet-text.workspace = true
unicode-segmentation.workspace = true

[lints]
workspace = true
