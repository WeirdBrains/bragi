[package]
name = "bragi-desktop"
description = "Bragi's desktop shell on GPUI: draws bragi-core's state and dispatches its actions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "bragi"
path = "src/main.rs"

# `gui` is the GPUI window (`bragi desktop`). Without it (BSD, servers, SSH-only machines) the
# same `bragi` binary is the terminal app, MCP server and `bragi serve`, with no GUI libraries.
[features]
default = ["gui"]
gui = ["dep:cpal", "dep:gpui", "dep:gpui_platform", "dep:qrcode", "dep:weirdnet-text", "dep:unicode-segmentation", "dep:tempfile", "dep:tokio", "dep:weirdnet-themes"]

[dependencies]
base64.workspace = true
bragi-core = { workspace = true, features = ["decode"] }
bragi-mcp.workspace = true
bragi-serve.workspace = true
bragi-tui = { path = "../bragi-tui" }
cpal = { workspace = true, optional = true }
gpui = { workspace = true, optional = true }
gpui_platform = { workspace = true, optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
weirdnet-text = { workspace = true, optional = true }
weirdnet-themes = { workspace = true, optional = true }
unicode-segmentation = { workspace = true, optional = true }

[lints]
workspace = true
