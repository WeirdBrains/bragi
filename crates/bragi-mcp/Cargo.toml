[package]
name = "bragi-mcp"
description = "`bragi mcp`: Bragi as a Model Context Protocol server (stdio, or loopback HTTP with a token), on bragi-core and weirdnet-mcp."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "bragi-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64.workspace = true
bragi-core.workspace = true
# The local API token and the Bragi home, shared with `bragi serve`.
bragi-serve.workspace = true
getrandom.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal", "io-std", "io-util", "fs"] }
weirdnet-mcp = { version = "0.6", features = ["stdio-server", "axum"] }

[dev-dependencies]
reqwest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "process"] }

[lints]
workspace = true
