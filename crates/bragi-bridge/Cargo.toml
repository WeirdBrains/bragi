[package]
name = "bragi-bridge"
description = "flutter_rust_bridge API over bragi-core for the Bragi Flutter app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "bragi_bridge"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
bragi-core.workspace = true
flutter_rust_bridge.workspace = true
tokio.workspace = true
tracing.workspace = true
weirdnet-net.workspace = true

# The Android JNI init (ndk-context for hickory-resolver) comes from weirdnet-net; see src/android.rs.

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }
