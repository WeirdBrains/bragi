[package]
name = "bragi-bridge"
description = "flutter_rust_bridge API over bragi-core for the Bragi Flutter app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "bragi_bridge"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
bragi-core.workspace = true
flutter_rust_bridge.workspace = true
tokio.workspace = true

# hickory-resolver (libp2p DNS inside weirdnet-net) reads the system DNS servers through
# ndk-context on Android; see src/android.rs.
[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "0.4.1"
ndk-context = "0.1.1"

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }
