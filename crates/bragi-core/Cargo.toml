[package]
name = "bragi-core"
description = "Bragi's one client core: pairing, the model catalog, streaming chat with cancel, history, and code suggestions and rewrites. Both shells only draw it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# Decoding WAV and MP3 for a shell that plays through its own audio output (the desktop).
decode = ["dep:symphonia"]
# The optional on-device model's engine: llama.cpp in-process (B4). Off here so everyday builds
# skip llama.cpp's C++ build; release builds turn it on where llama.cpp builds.
on-device = ["weirdnet-model/llama", "dep:llama-cpp-2"]

[dependencies]
symphonia = { workspace = true, optional = true }
anyhow.workspace = true
async-trait.workspace = true
chacha20poly1305.workspace = true
blake3 = "1.8"
if-addrs = "0.15"
reqwest.workspace = true
base64.workspace = true
futures.workspace = true
getrandom.workspace = true
ignore.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
weirdnet-agent.workspace = true
weirdnet-mcp = { version = "0.6.2", features = ["agent"] }
weirdnet-backends.workspace = true
weirdnet-model.workspace = true
weirdnet-device-link.workspace = true
weirdnet-net.workspace = true
weirdnet-sync.workspace = true
weirdnet-push.workspace = true
zeroize.workspace = true
weirdnet-themes.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
keyring.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Only to choose llama.cpp's C++ runtime on Android (on-device): the static libc++, since a Flutter apk
# ships no libc++_shared.so for the bridge to load. weirdnet-model builds llama-cpp-2 without its default
# features, so nothing else changes. Keep the version at weirdnet-model's.
[target.'cfg(target_os = "android")'.dependencies]
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["android-static-stdcxx"], optional = true }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
weirdnet-mcp = { version = "0.6.2", features = ["agent", "axum"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread", "macros"] }

[lints]
workspace = true
