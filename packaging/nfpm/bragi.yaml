# nfpm config for the `bragi` package: the desktop shell with its desktop entry and icons.
# Used by scripts/dist-linux.sh, which sets BRAGI_VERSION, BRAGI_ARCH and BRAGI_BUNDLE.
name: bragi
arch: "${BRAGI_ARCH}"
platform: linux
version: "${BRAGI_VERSION}"
version_schema: semver
release: "1"
section: net
priority: optional
maintainer: "Weird Brains LLC <m3talsmith@gmail.com>"
vendor: "Weird Brains LLC"
homepage: https://github.com/WeirdBrains/bragi
license: BSD-3-Clause
description: "Chat with your private AI cloud (Ymir) over Weirdnet. Desktop app."
conflicts: [bragi-standalone, bragi-bin]
overrides:
  deb:
    depends: [libc6, libgcc-s1, libxkbcommon0, libxkbcommon-x11-0, libxcb1, libwayland-client0, libvulkan1, libfontconfig1, libfreetype6]
  rpm:
    depends: [glibc, libgcc, libxkbcommon, libxkbcommon-x11, libxcb, libwayland-client, vulkan-loader, fontconfig, freetype]
  archlinux:
    depends: [glibc, gcc-libs, libxkbcommon, libxkbcommon-x11, libxcb, wayland, vulkan-icd-loader, fontconfig, freetype2]
contents:
  - src: "${BRAGI_BUNDLE}/bin/bragi"
    dst: /usr/bin/bragi
    file_info: {mode: 0755}
  - src: "${BRAGI_BUNDLE}/share/applications/bragi.desktop"
    dst: /usr/share/applications/bragi.desktop
  - src: "${BRAGI_BUNDLE}/share/icons/hicolor"
    dst: /usr/share/icons/hicolor
    type: tree
  - src: "${BRAGI_BUNDLE}/LICENSE"
    dst: /usr/share/licenses/bragi/LICENSE
  - src: "${BRAGI_BUNDLE}/README.md"
    dst: /usr/share/doc/bragi/README.md
