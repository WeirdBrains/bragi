# F-Droid build recipe for fdroiddata (metadata/org.weirdbrains.bragi.yml), not submitted yet.
# Store text and the icon are in fastlane/metadata/android/en-US at the repository root.
# Checked with `fdroid lint`/`fdroid rewritemeta` (fdroidserver in a venv), never built with
# `fdroid build` here: the toolchain steps may need adjusting with F-Droid's reviewers.
#
# F-Droid builds swap app/lib/src/scanner.dart for scanner_none.dart and drop mobile_scanner (it
# reads QR codes with Google ML Kit, which is not free software), so they pair by typed code only.
# One build per ABI; Flutter's --split-per-abi adds 1000 (armeabi-v7a), 2000 (arm64-v8a) or 4000
# (x86_64) to the pubspec build number. The first tag with the swap is v0.15.0 (build 18).
# Builds after 0.16.1 compile llama.cpp (the on-device model's engine, with CMake and the NDK) through the
# Flutter build hook, so `cmake` needs adding to `sudo`.
Categories:
  - AI Chat
  - Internet
License: BSD-3-Clause
AuthorName: Weird Brains LLC
WebSite: https://bragi.weirdbrains.com
SourceCode: https://github.com/WeirdBrains/bragi
IssueTracker: https://github.com/WeirdBrains/bragi/issues
Changelog: https://github.com/WeirdBrains/bragi/blob/HEAD/CHANGELOG.md

AutoName: Bragi

RepoType: git
Repo: https://github.com/WeirdBrains/bragi.git

Builds:
  - versionName: 0.15.0
    versionCode: 1018
    commit: v0.15.0
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y build-essential clang
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@3.50.0
      - rustup@1.28.2
    prebuild:
      - cp lib/src/scanner_none.dart lib/src/scanner.dart
      - sed -i -e '/mobile_scanner/d' pubspec.yaml
      - $$rustup$$/rustup-init.sh -y --profile minimal --default-toolchain 1.99.0
        --target armv7-linux-androideabi
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - app/.pub-cache
    build:
      - source $HOME/.cargo/env
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform
        android-arm
    ndk: r28c

  - versionName: 0.15.0
    versionCode: 2018
    commit: v0.15.0
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y build-essential clang
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@3.50.0
      - rustup@1.28.2
    prebuild:
      - cp lib/src/scanner_none.dart lib/src/scanner.dart
      - sed -i -e '/mobile_scanner/d' pubspec.yaml
      - $$rustup$$/rustup-init.sh -y --profile minimal --default-toolchain 1.99.0
        --target aarch64-linux-android
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - app/.pub-cache
    build:
      - source $HOME/.cargo/env
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform
        android-arm64
    ndk: r28c

  - versionName: 0.15.0
    versionCode: 4018
    commit: v0.15.0
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y build-essential clang
    output: build/app/outputs/flutter-apk/app-x86_64-release.apk
    srclibs:
      - flutter@3.50.0
      - rustup@1.28.2
    prebuild:
      - cp lib/src/scanner_none.dart lib/src/scanner.dart
      - sed -i -e '/mobile_scanner/d' pubspec.yaml
      - $$rustup$$/rustup-init.sh -y --profile minimal --default-toolchain 1.99.0
        --target x86_64-linux-android
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - app/.pub-cache
    build:
      - source $HOME/.cargo/env
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform
        android-x64
    ndk: r28c

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
VercodeOperation:
  - 1000 + %c
  - 2000 + %c
  - 4000 + %c
UpdateCheckData: app/pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.15.0
CurrentVersionCode: 4018
