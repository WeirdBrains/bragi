[workspace]
resolver = "3"
members = ["crates/bragi-core", "crates/bragi-desktop", "crates/bragi-bridge", "crates/bragi-tui", "crates/bragi-serve", "crates/bragi-mcp"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.99"
license = "BSD-3-Clause"
authors = ["Weird Brains LLC"]
repository = "https://github.com/WeirdBrains/bragi"
homepage = "https://github.com/WeirdBrains/bragi"

[workspace.dependencies]
bragi-core = { path = "crates/bragi-core" }
bragi-serve = { path = "crates/bragi-serve" }
bragi-mcp = { path = "crates/bragi-mcp" }

# Published Weirdnet crates, used as they are.
weirdnet-agent = { version = "0.5.0", features = ["pool", "serve"] }
# Model management over Weirdnet (LF-30): the models/1 client and its types, and the Hub search.
weirdnet-backends = { version = "0.3.0", features = ["node"] }
weirdnet-model = { version = "0.5.1", default-features = false }
weirdnet-device-link = "0.4.2"
weirdnet-net = "=0.8.2"
weirdnet-sync = "0.7.1"
weirdnet-text = "0.1"
# Themes (LF-33): the TOML theme format, built-ins and the user-theme helpers (0.2.0).
weirdnet-themes = { version = "0.2.0", default-features = false }

anyhow = "1"
# OpenAI-compatible endpoints (LF-11): rustls so Android needs no system TLS; streaming bodies.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
# Sealed store for endpoint API keys.
chacha20poly1305 = "0.10"
async-trait = "0.1"
# Image and audio attachments are sent as base64 content parts.
base64 = "0.21"
futures = "0.3"
getrandom = "0.3"
ignore = "0.4"
keyring = { version = "4", default-features = false, features = ["v1"] }
# Markdown in replies: parsed once in bragi-core for every shell. No HTML renderer, no fetching.
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2.7"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"
flutter_rust_bridge = "=2.13.0"
# GPUI from Zed, pinned to the commit Morph uses (crates.io gpui lags it). Bump on purpose.
gpui = { git = "https://github.com/zed-industries/zed", rev = "703b5ac3f4ffe1e87a073123ae56e22f72f095c4" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "703b5ac3f4ffe1e87a073123ae56e22f72f095c4", features = ["font-kit", "wayland", "x11"] }
unicode-segmentation = "1"
# Playing the sound files in a chat on the desktop (LF-12 follow-up): decoding (pure Rust, WAV and
# MP3 only) and the audio output, as Mouser's player uses.
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3"] }
cpal = "0.15"
zeroize = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

# Shipped builds favour size (the Android APK).
[profile.release]
opt-level = "s"
lto = "thin"
strip = "symbols"

# Patched copies of published crates; why and when they go away: third_party/README.md.
[patch.crates-io]
libp2p-swarm = { path = "third_party/libp2p-swarm" }
