# Release builds for every platform Bragi ships (docs/RELEASES.md). Runs on v* tags and by hand. It only
# builds and uploads workflow artifacts; the GitHub release itself is made afterwards with
# `scripts/weirdnet_release.py github VERSION` from the downloaded artifacts. All jobs run on
# GitHub-hosted runners. Nothing is code-signed except an Android release key when its secrets exist.
# The desktop archives and installers bundle the LGPL ffmpeg and ffprobe that scripts/build-ffmpeg.sh builds
# on each runner from the pinned, checksummed FFmpeg tarball (docs/design/video.md, "Platform packaging"):
# Linux tarballs and zips (bin/), macOS Bragi.app (Contents/Helpers) and tarball, Windows zip and installers
# (beside bragi.exe). The desktop builds have the on-device model's engine (Cargo feature `on-device`, llama.cpp):
# Linux and Windows on a generic CPU, macOS with Metal; the Android and iOS apps' bridge too (app/hook/build.dart). Each job checks the engine is in the binary and that no
# runner path (the checkout, the cargo registry, the home folder) is in it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # gpui is a git dependency on the zed repo.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  FLUTTER_VERSION: "3.50.0"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Desktop shell build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb1-dev libwayland-dev libvulkan-dev libfontconfig-dev libfreetype-dev libssl-dev libzstd-dev libdbus-1-dev libasound2-dev
      - run: python3 scripts/weirdnet_release.py validate
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Clippy with the on-device engine (llama.cpp), as the Linux release builds it
        run: cargo clippy --locked -p bragi-desktop --features on-device --all-targets -- -D warnings
      - name: Clippy on the terminal-only bragi (no gui feature), as the Linux and BSD builds make it
        run: cargo clippy --locked -p bragi-desktop --no-default-features --all-targets -- -D warnings
      - run: cargo test -q --locked --workspace

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, nfpm: x86_64, nfpm_sha: 2afaa5ffb5e3493402e31e7c67a5a1fb42133e3f66fc315ca0051934125561c7 }
          - { arch: aarch64, runner: ubuntu-22.04-arm, nfpm: arm64, nfpm_sha: d4eee71839e92c68cbd3b101640bad32d2856fc551acae0635be9118e48c9d9c }
    # Ubuntu 22.04 (glibc 2.35), so the binary also runs on Debian 12 and other older distributions.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-${{ matrix.arch }}
      - name: Build dependencies and a pinned nfpm 2.49.0
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake nasm pkg-config zip libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb1-dev libwayland-dev libvulkan-dev libfontconfig-dev libfreetype-dev libssl-dev libzstd-dev libdbus-1-dev libasound2-dev
          curl -fsSLo nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v2.49.0/nfpm_2.49.0_Linux_${{ matrix.nfpm }}.tar.gz"
          echo "${{ matrix.nfpm_sha }}  nfpm.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/nfpm" && tar -C "$RUNNER_TEMP/nfpm" -xzf nfpm.tar.gz nfpm && rm nfpm.tar.gz
          echo "$RUNNER_TEMP/nfpm" >> "$GITHUB_PATH"
      - name: LGPL ffmpeg and ffprobe for the archives (scripts/build-ffmpeg.sh)
        run: |
          scripts/build-ffmpeg.sh "$RUNNER_TEMP/ffmpeg"
          echo "BRAGI_FFMPEG_DIR=$RUNNER_TEMP/ffmpeg" >> "$GITHUB_ENV"
      - run: scripts/dist-linux.sh
        env:
          BRAGI_FEATURES: on-device
      - name: Check the packages
        run: |
          for f in dist/*.deb; do dpkg-deb -I "$f" >/dev/null; dpkg-deb -c "$f"; done
          ldd target/release/bragi
          grep -aq llama_model_load target/release/bragi || { echo "::error::bragi was built without the on-device engine"; exit 1; }
          "$BRAGI_FFMPEG_DIR/bin/ffmpeg" -hide_banner -version | sed -n 1p
          for t in dist/bragi-[0-9]*-unknown-linux-gnu.tar.gz dist/bragi-tui-*-unknown-linux-gnu.tar.gz; do
            n=$(tar -tzf "$t" | grep -cE '/bin/ffmpeg$|/bin/ffprobe$|/share/doc/ffmpeg/SOURCE.txt$' || true)
            [ "$n" = 3 ] || { echo "::error::$t does not bundle ffmpeg"; exit 1; }
          done
          tar -tzf dist/bragi-[0-9]*-unknown-linux-gnu.tar.gz
          sudo apt-get install -y ./dist/bragi_*.deb
          bragi --version
          bragi-tui --version
          sudo apt-get remove -y bragi
          sudo apt-get install -y ./dist/bragi-tui_*.deb
          bragi-tui --version
          sudo apt-get remove -y bragi-tui
      - uses: actions/upload-artifact@v4
        with:
          name: bragi-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos
      - name: LGPL ffmpeg and ffprobe, universal (scripts/build-ffmpeg.sh for each arch, then lipo)
        run: |
          brew install nasm
          FFMPEG_CROSS="--extra-cflags=-mmacosx-version-min=11.0 --extra-ldflags=-mmacosx-version-min=11.0" \
            scripts/build-ffmpeg.sh "$RUNNER_TEMP/ffmpeg-arm64"
          FFMPEG_CROSS="--enable-cross-compile --arch=x86_64 --target-os=darwin --cc=clang --extra-cflags=--target=x86_64-apple-macos11 --extra-ldflags=--target=x86_64-apple-macos11" \
            scripts/build-ffmpeg.sh "$RUNNER_TEMP/ffmpeg-x86_64"
          u="$RUNNER_TEMP/ffmpeg"
          mkdir -p "$u/bin"
          for b in ffmpeg ffprobe; do
            lipo -create -output "$u/bin/$b" "$RUNNER_TEMP/ffmpeg-arm64/bin/$b" "$RUNNER_TEMP/ffmpeg-x86_64/bin/$b"
            lipo -info "$u/bin/$b"
          done
          cp "$RUNNER_TEMP/ffmpeg-arm64/LICENSE.md" "$RUNNER_TEMP/ffmpeg-arm64/SOURCE.txt" "$u/"
          { echo "arm64:"; cat "$RUNNER_TEMP/ffmpeg-arm64/CONFIG.txt"; echo; echo "x86_64:"; cat "$RUNNER_TEMP/ffmpeg-x86_64/CONFIG.txt"; } > "$u/CONFIG.txt"
          "$u/bin/ffmpeg" -hide_banner -version | sed -n 1p
          echo "BRAGI_FFMPEG_DIR=$u" >> "$GITHUB_ENV"
      - run: scripts/dist-macos.sh
        env:
          BRAGI_FEATURES: on-device
      - name: The on-device engine (llama.cpp with Metal) is in both slices, and no runner path is
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            grep -aq llama_model_load "target/$t/release/bragi" || { echo "::error::$t bragi was built without the on-device engine"; exit 1; }
            otool -L "target/$t/release/bragi" | grep -q '/Metal.framework/' || { echo "::error::$t bragi does not link Metal"; exit 1; }
          done
          paths=$(strings -a target/aarch64-apple-darwin/release/bragi target/x86_64-apple-darwin/release/bragi | grep -E '/Users/runner|/private/var/folders|/Volumes/' | sort -u || true)
          # GPUI's build embeds its compiled shaders.metallib, which records the metallib command and its
          # build-dir paths. That comes from the GPUI git dependency (not changed here) and was in earlier
          # releases too, so it is reported as a warning; any other runner path fails the job.
          if grep -q 'gpui_apple/[0-9a-f]*/out' <<<"$paths"; then
            echo "::warning::GPUI's embedded shaders.metallib records its build path (from the gpui dependency)"
          fi
          if grep -v 'gpui_apple/[0-9a-f]*/out' <<<"$paths" | head -20 | grep .; then
            echo "::error::a runner path is in the binary"; exit 1
          fi
      - name: The app and the tarball bundle ffmpeg
        run: |
          unzip -l dist/bragi-*-universal-apple-darwin.zip | grep -q 'Bragi.app/Contents/Helpers/ffprobe$'
          unzip -l dist/bragi-*-universal-apple-darwin.zip | grep -q 'Bragi.app/Contents/Helpers/ffmpeg$'
          tar -tzf dist/bragi-*-universal-apple-darwin.tar.gz | grep -q '/ffmpeg$'
      - name: The universal binary starts
        run: cd "$RUNNER_TEMP" && tar -xzf "$GITHUB_WORKSPACE"/dist/bragi-*-universal-apple-darwin.tar.gz && ./bragi-*/bragi --version && ./bragi-*/bragi-tui --version
      - uses: actions/upload-artifact@v4
        with:
          name: bragi-macos-universal
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
          if-no-files-found: error

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          # msystem and ffmpeg_flags: the MSYS2 toolchain scripts/build-ffmpeg.sh builds ffmpeg.exe with
          # (statically linked, so the exes need no MinGW DLLs).
          - { arch: x86_64, runner: windows-2025, msystem: UCRT64, msys_packages: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-nasm, ffmpeg_flags: --extra-ldflags=-static }
          - { arch: aarch64, runner: windows-11-arm, msystem: CLANGARM64, msys_packages: mingw-w64-clang-aarch64-clang, ffmpeg_flags: --cc=clang --extra-ldflags=-static }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-${{ matrix.arch }}
      # WiX 7 is used under the Open Source Maintenance Fee EULA v1.1, accepted on 2026-11-12
      # (docs/RELEASES.md); every wix command passes -acceptEula wix7. The CLI MSI is pinned by hash.
      - name: Install pinned WiX 7.0.1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msi = Join-Path $env:RUNNER_TEMP "wix-cli-x64.msi"
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix/releases/download/v7.0.1/wix-cli-x64.msi" -OutFile $msi
          $actual = (Get-FileHash -Algorithm SHA256 -Path $msi).Hash.ToLowerInvariant()
          if ($actual -ne "93673c89ab33b1fd3f07ad5e609b7cae694bd716b2914259b61a41c02303b64c") { throw "WiX MSI hash mismatch: $actual" }
          $p = Start-Process msiexec.exe -ArgumentList @("/i", "`"$msi`"", "/qn", "/norestart") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "WiX install failed: $($p.ExitCode)" }
          $bin = "C:\Program Files\WiX Toolset v7.0\bin"
          & (Join-Path $bin "wix.exe") extension add -acceptEula wix7 -g WixToolset.UI.wixext/7.0.1 WixToolset.BootstrapperApplications.wixext/7.0.1
          if ($LASTEXITCODE -ne 0) { throw "wix extension add failed: $LASTEXITCODE" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          update: false
          install: make diffutils tar xz curl ${{ matrix.msys_packages }}
      - name: LGPL ffmpeg.exe and ffprobe.exe (scripts/build-ffmpeg.sh in MSYS2)
        shell: msys2 {0}
        env:
          FFMPEG_CROSS: ${{ matrix.ffmpeg_flags }}
        run: |
          out="$(cygpath -u "$RUNNER_TEMP")/ffmpeg"
          scripts/build-ffmpeg.sh "$out"
          echo "BRAGI_FFMPEG_DIR=$(cygpath -w "$out")" >> "$GITHUB_ENV"
      - name: exe, zip, msi and setup.exe
        shell: pwsh
        env:
          BRAGI_FEATURES: on-device
        run: ./scripts/dist-windows.ps1
      - name: The on-device engine (llama.cpp) is in both exes, and no runner path is
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $runner = @([regex]::Escape($env:GITHUB_WORKSPACE), [regex]::Escape($env:USERPROFILE), "runneradmin") -join "|"
          foreach ($exe in Get-ChildItem dist\bragi-*.exe | Where-Object { $_.Name -notlike "*-setup.exe" }) {
            $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe.FullName))
            if ($text -notmatch "llama_model_load") { throw "$($exe.Name) was built without the on-device engine" }
            $hits = [regex]::Matches($text, "[ -~]*(?:$runner)[ -~]*", "IgnoreCase") | ForEach-Object { $_.Value } | Sort-Object -Unique
            if ($hits) { $hits | Select-Object -First 20 | ForEach-Object { Write-Host $_ }; throw "a runner path is in $($exe.Name)" }
          }
      - name: The zip bundles ffmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & (Join-Path $env:BRAGI_FFMPEG_DIR "bin\ffmpeg.exe") -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw "the bundled ffmpeg.exe does not start" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = (Get-ChildItem dist\bragi-*-pc-windows-msvc.zip | Select-Object -First 1).FullName
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          $names = $archive.Entries.FullName
          $archive.Dispose()
          foreach ($f in "ffmpeg.exe", "ffprobe.exe", "FFMPEG-SOURCE.txt") {
            if (-not ($names | Where-Object { $_ -match "(^|[/\\])$([regex]::Escape($f))$" })) { throw "$f is not in $zip" }
          }
      - name: Install the MSI per user, start, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msi = (Get-ChildItem dist\*.msi | Select-Object -First 1).FullName
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v msi-install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content msi-install.log -Tail 50; throw "install failed: $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Bragi\bragi.exe"
          if (!(Test-Path $exe)) { throw "bragi.exe not installed at $exe" }
          $tui = Join-Path $env:LOCALAPPDATA "Programs\Bragi\bragi-tui.exe"
          if (!(Test-Path $tui)) { throw "bragi-tui.exe not installed at $tui" }
          $ff = Join-Path $env:LOCALAPPDATA "Programs\Bragi\ffmpeg.exe"
          if (!(Test-Path $ff)) { throw "ffmpeg.exe not installed at $ff" }
          & $tui --version
          if ($LASTEXITCODE -ne 0) { throw "bragi-tui --version failed" }
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
          if (Test-Path $exe) { throw "bragi.exe left behind" }
      - uses: actions/upload-artifact@v4
        with:
          name: bragi-windows-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.msi
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: app/android/**/*.gradle*
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android
          workspaces: crates/bragi-bridge -> ../../app/.dart_tool/hooks_runner
      - run: flutter pub get
        working-directory: app
      # Release signing only when the BRAGI_ANDROID_* secrets exist; otherwise the debug key signs and the
      # apks are named *-debug-signed.apk (scripts/dist-android.sh).
      - name: Release signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.BRAGI_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BRAGI_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BRAGI_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BRAGI_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No BRAGI_ANDROID_* secrets: the apks are signed with the debug key (sideload only, no aab)"
            exit 0
          fi
          ks="$RUNNER_TEMP/bragi-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
          {
            echo "BRAGI_ANDROID_KEYSTORE=$ks"
            echo "BRAGI_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BRAGI_ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "BRAGI_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - run: scripts/dist-android.sh
      - name: The on-device engine (llama.cpp) is in every apk's bridge, with the static libc++ and no runner path
        run: |
          readelf=$(ls "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf | sort -V | tail -1)
          for f in dist/*.apk; do
            d=$(mktemp -d) && unzip -q "$f" 'lib/*/libbragi_bridge.so' -d "$d"
            for so in "$d"/lib/*/libbragi_bridge.so; do
              grep -aq llama_model_load "$so" || { echo "::error::$f: $so has no on-device engine"; exit 1; }
              if "$readelf" -d "$so" | grep -q 'libc++_shared'; then echo "::error::$f: $so needs libc++_shared.so"; exit 1; fi
              if strings -a "$so" | grep -E '/home/runner|/opt/hostedtoolcache' | sort -u | head -5 | grep .; then
                echo "::error::$f: a runner path is in $so"; exit 1
              fi
            done
            rm -rf "$d"
          done
      - name: APK signer
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          for f in dist/*.apk; do echo "$f"; "$apksigner" verify --print-certs "$f" | grep -E "certificate (DN|SHA-256 digest)"; done
      - uses: actions/upload-artifact@v4
        with:
          name: bragi-android
          path: |
            dist/*.apk
            dist/*.aab
          if-no-files-found: error

  ios:
    runs-on: macos-15
    env:
      # The Rust objects and the Xcode project must agree on the minimum iOS.
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Xcode 26 (video_player_avfoundation 2.12.5 calls the iOS 26 SDK's AVAsset.load(_:isolation:))
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
      - run: flutter config --enable-swift-package-manager
      - run: scripts/dist-ios.sh
      - name: The on-device engine (llama.cpp with Metal) is in the bridge, and no runner path is
        run: |
          d=$(mktemp -d) && unzip -q dist/*.ipa -d "$d"
          so=$(find "$d/Payload/Runner.app/Frameworks" -type f -perm -u+x -path '*bragi_bridge*' | head -1)
          [ -n "$so" ] || { find "$d/Payload/Runner.app/Frameworks" -maxdepth 2; echo "::error::no bridge framework in the ipa"; exit 1; }
          grep -aq llama_model_load "$so" || { echo "::error::$so has no on-device engine"; exit 1; }
          otool -L "$so" | grep -q '/Metal.framework/' || { echo "::error::$so does not link Metal"; exit 1; }
          if strings -a "$so" | grep -E '/Users/runner|/private/var/folders' | sort -u | head -5 | grep .; then
            echo "::error::a runner path is in $so"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bragi-ios
          path: dist/*.ipa
          if-no-files-found: error

  minisign:
    # Signs every release file with minisign when MINISIGN_SECRET_KEY (and MINISIGN_PASSWORD) are set;
    # without them it skips with a notice instead of failing the release.
    needs: [linux, macos, windows, android, ios]
    runs-on: ubuntu-24.04
    env:
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
      MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
    steps:
      - name: Skip without a signing key
        if: env.MINISIGN_SECRET_KEY == ''
        run: echo "::notice::MINISIGN_SECRET_KEY is not set, so release files are not minisign-signed."
      - uses: actions/download-artifact@v4
        if: env.MINISIGN_SECRET_KEY != ''
        with:
          path: dist
          merge-multiple: true
      - name: Sign
        if: env.MINISIGN_SECRET_KEY != ''
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q minisign
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          for f in dist/*; do printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$RUNNER_TEMP/minisign.key" -m "$f" > /dev/null; done
          rm -f "$RUNNER_TEMP/minisign.key"
      - uses: actions/upload-artifact@v4
        if: env.MINISIGN_SECRET_KEY != ''
        with:
          name: bragi-minisign
          path: dist/*.minisig
