# Build-only checks for the desktop shell on macOS and Windows, and the Flutter app on iOS (no
# signing, nothing published). Run by hand or when the shells change. NOTE: written on a Linux
# box that cannot run macOS or Windows runners; `cargo check --target x86_64-pc-windows-gnu`
# passes there, the rest of this file has not run yet.
name: Platforms
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Run one job only: desktop, ios or freebsd (default: desktop and ios)'
        required: false
        default: ''
  pull_request:
    paths: ['crates/bragi-desktop/**', 'crates/bragi-core/**', 'app/**', '.github/workflows/platforms.yml']
permissions:
  contents: read
jobs:
  desktop:
    if: ${{ github.event.inputs.only == '' || github.event.inputs.only == 'desktop' || github.event_name != 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p bragi-desktop
      - run: cargo test -p bragi-core -p bragi-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: bragi-${{ matrix.os }}
          path: |
            target/release/bragi
            target/release/bragi.exe
          if-no-files-found: ignore
  ios:
    env:
      # The Rust objects and the Xcode project must agree on the minimum iOS.
      IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    if: ${{ github.event.inputs.only == '' || github.event.inputs.only == 'ios' || github.event_name != 'workflow_dispatch' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter build ios --release --no-codesign
        working-directory: app
        id: build
        continue-on-error: true
      - name: The linker's real error, if the build failed
        if: steps.build.outcome == 'failure'
        working-directory: app/ios
        run: |
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO build > /tmp/xcb.log 2>&1 || true
          grep -v '^ *export \|built for newer' /tmp/xcb.log | grep -n -E ' error: |^ld: |Undefined symbols|duplicate symbol|not found for|clang: error|library .* not found|framework .* not found' -A8 | head -n 100
          exit 1
  # FreeBSD (what GhostBSD is built on). GPUI's Linux platform crate covers target_os = "freebsd".
  # It cannot be cross-checked from Linux (no FreeBSD sysroot; aws-lc-sys fails), so it builds in a
  # FreeBSD VM. Written on a Linux box and NOT RUN yet. Manual only (only: freebsd). OpenBSD and
  # DragonFly are not targets GPUI supports.
  freebsd:
    if: ${{ github.event.inputs.only == 'freebsd' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cross-platform-actions/action@v0.29.0
        with:
          operating_system: freebsd
          version: '14.2'
          run: |
            sudo pkg install -y ca_root_nss brotli curl cmake pkgconf wayland libxkbcommon libxcb vulkan-loader git fontconfig freetype2 libX11 openssl
            # The pkg `rust` lags (1.98); the crates need 1.99, so use rustup's stable.
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            # gpui is a git dependency on the zed repo; libgit2 cannot fetch that revision, git can.
            export CARGO_NET_GIT_FETCH_WITH_CLI=true
            # freetype2.pc names bzip2, which FreeBSD ships in the base system without a .pc file.
            mkdir -p "$HOME/pc"
            printf 'Name: bzip2\nDescription: bzip2 from the FreeBSD base system\nVersion: 1.0.8\nLibs: -lbz2\nCflags:\n' > "$HOME/pc/bzip2.pc"
            export PKG_CONFIG_PATH="$HOME/pc:/usr/local/libdata/pkgconfig:/usr/libdata/pkgconfig"
            export CARGO_HTTP_CAINFO=/usr/local/share/certs/ca-root-nss.crt SSL_CERT_FILE=/usr/local/share/certs/ca-root-nss.crt
            # The core (no toolkit) must build and pass. The desktop app is tried and reported, but GPUI does
            # not compile for FreeBSD at the pinned rev or on Zed's main (gpui gates layer_shell and the priority
            # queue to linux/windows/wasm while gpui_linux uses them), so it may not fail the job yet.
            cargo test -p bragi-core
            cargo build -p bragi-desktop || echo "::warning::bragi-desktop does not build on FreeBSD (GPUI)"

